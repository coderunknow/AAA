name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EMSDK_VERSION: 4.0.11   # same Emscripten release the sandbox toolchain was paired with

jobs:
  tools:
    name: Host tools (bgfx shaderc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
          key: shaderc-${{ hashFiles('cmake/Dependencies.cmake') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake --preset tools
          cmake --build --preset tools --target shaderc
      - uses: actions/upload-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc

  native:
    name: Unit tests + headless smoke runs
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/download-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx
      - run: chmod +x build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
      - name: Configure native-headless
        run: |
          cmake --preset native-headless -DSDL_UNIX_CONSOLE_BUILD=ON > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "native-headless configure failed"; exit 1; }
      - name: Build native-headless
        run: |
          cmake --build --preset native-headless > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "native-headless build failed"; exit 1; }
      - name: Test native-headless
        run: |
          ctest --preset native-headless > /tmp/ctest.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/ctest.log "native-headless ctest failed"; exit 1; }

  native-windowed:
    name: Native windowed build (compile + link)
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # SDL3's X11 checks are fatal when these are missing (XTEST/XFIXES/XRENDER are
      # on by default), so the windowed job needs the full X11 dev set.
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxfixes-dev libxrender-dev libgl-dev libegl-dev libasound2-dev libpulse-dev
      - uses: actions/download-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx
      - run: chmod +x build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
      - name: Configure native-dev
        run: |
          cmake --preset native-dev -DAAA_BUILD_TESTS=OFF > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "native-dev configure failed"; exit 1; }
      - name: Build native-dev
        run: |
          cmake --build --preset native-dev > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "native-dev build failed"; exit 1; }

  web:
    name: WebAssembly release
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx
      - run: chmod +x build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
      - name: Configure web-release
        run: |
          EMSCRIPTEN_ROOT="$EMSDK/upstream/emscripten" cmake --preset web-release > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "web-release configure failed"; exit 1; }
      - name: Build web-release
        run: |
          cmake --build --preset web-release > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "web-release build failed"; exit 1; }
      - name: Collect site
        run: |
          mkdir -p site
          cp build/web-release/src/app/index.{html,js,wasm,data} site/
          ls -la site
      - uses: actions/upload-artifact@v4
        with:
          name: mistpine-web
          path: site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    # Pages must be enabled (Settings -> Pages -> Source: GitHub Actions); otherwise this job
    # fails without affecting the build result.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  sanitizers:
    name: "Sanitizers (ASan + UBSan: unit tests + smoke runs)"
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/download-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx
      - run: chmod +x build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
      - name: Configure (ASan + UBSan)
        run: |
          cmake --preset native-headless -DSDL_UNIX_CONSOLE_BUILD=ON -DAAA_SANITIZERS=ON > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "sanitizers configure failed"; exit 1; }
      - name: Build
        run: |
          cmake --build --preset native-headless > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "sanitizers build failed"; exit 1; }
      - name: Test
        run: |
          ctest --preset native-headless > /tmp/ctest.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/ctest.log "sanitizers ctest failed"; exit 1; }

  shader-profiles:
    name: Shader profiles (essl, glsl, spirv, metal)
    needs: tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/download-artifact@v4
        with:
          name: shaderc
          path: build/tools/_deps/bgfx_cmake-build/cmake/bgfx
      - run: chmod +x build/tools/_deps/bgfx_cmake-build/cmake/bgfx/shaderc
      - name: Compile every profile the Linux shaderc can emit
        run: |
          cmake --preset native-headless -DSDL_UNIX_CONSOLE_BUILD=ON -DAAA_SHADER_PROFILE_SET=host-all > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "shader-profiles configure failed"; exit 1; }
          cmake --build --preset native-headless --target aaa_shaders > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "shader compilation failed"; exit 1; }
          ls build/native-headless/assets/shaders/

  shader-profiles-windows:
    name: Shader profiles (dx11 on a Windows shaderc)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The pinned Linux shaderc cannot emit SM 5.0 (no D3DCompiler support), so the
      # dx11 profile is compiled with a shaderc built on Windows (PROMPT §8.1).
      - name: Build shaderc (MSVC)
        run: |
          cmake --preset tools
          cmake --build --preset tools --target shaderc
      - name: Compile the Windows profile set (dx11, spirv, glsl)
        run: |
          cmake --preset native-dev -DAAA_BUILD_TESTS=OFF -DAAA_SHADER_PROFILE_SET=windows > /tmp/cfg.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/cfg.log "windows shader-profiles configure failed"; exit 1; }
          cmake --build --preset native-dev --target aaa_shaders > /tmp/build.log 2>&1 ||
            { scripts/ci_annotate_failure.sh /tmp/build.log "windows shader compilation failed"; exit 1; }
          ls build/native-dev/assets/shaders/
