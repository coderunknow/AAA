name: diag

# TEMPORARY diagnostic workflow (session branch only): reproduces the
# native-windowed CI configure failure and annotates the job with the log tail,
# because job logs cannot be downloaded from the Arena sandbox.
# Delete before the release PR is finalised.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dev-configure:
    name: native-dev configure (diagnostic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libgl-dev libasound2-dev libpulse-dev
      - name: configure
        run: |
          cmake --preset native-dev -DAAA_BUILD_TESTS=OFF > /tmp/configure.log 2>&1 || {
            python3 - <<'PY'
            tail = open('/tmp/configure.log','rb').read()[-9000:].decode('utf-8','replace')
            tail = tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
            print(f"::error::CONFIGURE FAILED, log tail:%0A{tail}")
            PY
            exit 1
          }
      - name: build
        run: cmake --build --preset native-dev > /tmp/build.log 2>&1 || {
          python3 - <<'PY'
          tail = open('/tmp/build.log','rb').read()[-9000:].decode('utf-8','replace')
          tail = tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f"::error::BUILD FAILED, log tail:%0A{tail}")
          PY
          exit 1
        }
